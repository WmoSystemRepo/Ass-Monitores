  orquestrador-api:
    build:
      context: ./0-Orquestrador
      dockerfile: Dockerfile
    image: dfend-cte-orquestrador:local
    container_name: dfend-cte-orquestrador
    ports:
      - "5000:5000"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5000
      Orchestrator__ServiceId: dfend-cte-orchestrator
      Orchestrator__RegistrySchemaVersion: "1.0"
      Orchestrator__InternalApiKey: ${CTE_INTERNAL_API_KEY:-dev-cte-chain-key}
      Orchestrator__LocalDev__AutoStartMonitors: "false"
      Orchestrator__LocalDev__EnsureBeforeCascade: "false"
      Orchestrator__PollIntervalMs: "2000"
      Orchestrator__PollUntilSettledSeconds: "60"
      Orchestrator__HttpTimeoutSeconds: "5"
      Orchestrator__HealthTimeoutSeconds: "3"
      Orchestrator__StartStopHttpTimeoutSeconds: "10"
      Orchestrator__CircuitBreakerMinimumThroughput: "5"
      Orchestrator__CircuitBreakerBreakDurationSeconds: "30"
      Orchestrator__Systems__0__Id: receptor
      Orchestrator__Systems__0__DisplayName: Receptor
      Orchestrator__Systems__0__Symbol: R
      Orchestrator__Systems__0__Version: "1.0"
      Orchestrator__Systems__0__Order: "1"
      Orchestrator__Systems__0__BaseUrl: http://monitor-receptor-api:5010
      Orchestrator__Systems__0__FrontendUrl: http://localhost:4200
      Orchestrator__Systems__0__Enabled: "true"
      Orchestrator__Systems__0__Endpoints__Api: http://monitor-receptor-api:5010
      Orchestrator__Systems__0__Endpoints__Frontend: http://localhost:4200
      Orchestrator__Systems__0__Endpoints__HealthLive: /health
      Orchestrator__Systems__0__Endpoints__HealthReady: /health/ready
      Orchestrator__Systems__0__Endpoints__Status: /api/monitor/service/status
      Orchestrator__Systems__0__Endpoints__Start: /api/monitor/service/start
      Orchestrator__Systems__0__Endpoints__Stop: /api/monitor/service/stop
      Orchestrator__Systems__0__Endpoints__Metrics: /api/monitor/snapshot
      Orchestrator__Systems__0__Instances__Mode: active
      Orchestrator__Systems__1__Id: arquivador
      Orchestrator__Systems__1__DisplayName: Arquivador
      Orchestrator__Systems__1__Symbol: A
      Orchestrator__Systems__1__Version: "1.0"
      Orchestrator__Systems__1__Order: "2"
      Orchestrator__Systems__1__DependsOn__0: receptor
      Orchestrator__Systems__1__BaseUrl: http://monitor-arquivador-api:5020
      Orchestrator__Systems__1__FrontendUrl: http://localhost:4210
      Orchestrator__Systems__1__Enabled: "true"
      Orchestrator__Systems__1__Endpoints__Api: http://monitor-arquivador-api:5020
      Orchestrator__Systems__1__Endpoints__Frontend: http://localhost:4210
      Orchestrator__Systems__1__Endpoints__HealthLive: /health
      Orchestrator__Systems__1__Endpoints__HealthReady: /health/ready
      Orchestrator__Systems__1__Endpoints__Status: /api/monitor/service/status
      Orchestrator__Systems__1__Endpoints__Start: /api/monitor/service/start
      Orchestrator__Systems__1__Endpoints__Stop: /api/monitor/service/stop
      Orchestrator__Systems__1__Endpoints__Metrics: /api/monitor/snapshot
      Orchestrator__Systems__1__Instances__Mode: active
      Orchestrator__Systems__2__Id: sintetizador
      Orchestrator__Systems__2__DisplayName: Sintetizador
      Orchestrator__Systems__2__Symbol: S
      Orchestrator__Systems__2__Version: "1.0"
      Orchestrator__Systems__2__Order: "3"
      Orchestrator__Systems__2__DependsOn__0: arquivador
      Orchestrator__Systems__2__BaseUrl: http://monitor-sintetizador-api:5030
      Orchestrator__Systems__2__FrontendUrl: http://localhost:4230
      Orchestrator__Systems__2__Enabled: "true"
      Orchestrator__Systems__2__Endpoints__Api: http://monitor-sintetizador-api:5030
      Orchestrator__Systems__2__Endpoints__Frontend: http://localhost:4230
      Orchestrator__Systems__2__Endpoints__HealthLive: /health
      Orchestrator__Systems__2__Endpoints__HealthReady: /health/ready
      Orchestrator__Systems__2__Endpoints__Status: /api/monitor/service/status
      Orchestrator__Systems__2__Endpoints__Start: /api/monitor/service/start
      Orchestrator__Systems__2__Endpoints__Stop: /api/monitor/service/stop
      Orchestrator__Systems__2__Endpoints__Metrics: /api/monitor/snapshot
      Orchestrator__Systems__2__Ui__Icon: layers
      Orchestrator__Systems__2__Ui__Color: "#7c3aed"
      Orchestrator__Systems__2__Instances__Mode: active
      Orchestrator__Systems__3__Id: analisador
      Orchestrator__Systems__3__DisplayName: Analisador
      Orchestrator__Systems__3__Symbol: An
      Orchestrator__Systems__3__Version: "1.0"
      Orchestrator__Systems__3__Order: "4"
      Orchestrator__Systems__3__DependsOn__0: sintetizador
      Orchestrator__Systems__3__BaseUrl: http://monitor-analisador-api:5040
      Orchestrator__Systems__3__FrontendUrl: http://localhost:4240
      Orchestrator__Systems__3__Enabled: "true"
      Orchestrator__Systems__3__Endpoints__Api: http://monitor-analisador-api:5040
      Orchestrator__Systems__3__Endpoints__Frontend: http://localhost:4240
      Orchestrator__Systems__3__Endpoints__HealthLive: /health
      Orchestrator__Systems__3__Endpoints__HealthReady: /health/ready
      Orchestrator__Systems__3__Endpoints__Status: /api/monitor/service/status
      Orchestrator__Systems__3__Endpoints__Start: /api/monitor/service/start
      Orchestrator__Systems__3__Endpoints__Stop: /api/monitor/service/stop
      Orchestrator__Systems__3__Endpoints__Metrics: /api/monitor/snapshot
      Orchestrator__Systems__3__Ui__Icon: search
      Orchestrator__Systems__3__Ui__Color: "#0891b2"
      Orchestrator__Systems__3__Instances__Mode: active
      Orchestrator__Systems__4__Id: integrador
      Orchestrator__Systems__4__DisplayName: Integrador
      Orchestrator__Systems__4__Symbol: I
      Orchestrator__Systems__4__Version: "1.0"
      Orchestrator__Systems__4__Order: "5"
      Orchestrator__Systems__4__DependsOn__0: analisador
      Orchestrator__Systems__4__BaseUrl: http://monitor-integrador-api:5050
      Orchestrator__Systems__4__FrontendUrl: http://localhost:4250
      Orchestrator__Systems__4__Enabled: "true"
      Orchestrator__Systems__4__Endpoints__Api: http://monitor-integrador-api:5050
      Orchestrator__Systems__4__Endpoints__Frontend: http://localhost:4250
      Orchestrator__Systems__4__Endpoints__HealthLive: /health
      Orchestrator__Systems__4__Endpoints__HealthReady: /health/ready
      Orchestrator__Systems__4__Endpoints__Status: /api/monitor/service/status
      Orchestrator__Systems__4__Endpoints__Start: /api/monitor/service/start
      Orchestrator__Systems__4__Endpoints__Stop: /api/monitor/service/stop
      Orchestrator__Systems__4__Endpoints__Metrics: /api/monitor/snapshot
      Orchestrator__Systems__4__Ui__Icon: share-2
      Orchestrator__Systems__4__Ui__Color: "#ea580c"
      Orchestrator__Systems__4__Instances__Mode: active
      Orchestrator__Systems__5__Id: carga
      Orchestrator__Systems__5__DisplayName: Carga
      Orchestrator__Systems__5__Symbol: C
      Orchestrator__Systems__5__Version: "1.0"
      Orchestrator__Systems__5__Order: "6"
      Orchestrator__Systems__5__DependsOn__0: integrador
      Orchestrator__Systems__5__BaseUrl: http://monitor-carga-api:5080
      Orchestrator__Systems__5__FrontendUrl: http://localhost:4260
      Orchestrator__Systems__5__Enabled: "true"
      Orchestrator__Systems__5__Endpoints__Api: http://monitor-carga-api:5080
      Orchestrator__Systems__5__Endpoints__Frontend: http://localhost:4260
      Orchestrator__Systems__5__Endpoints__HealthLive: /health
      Orchestrator__Systems__5__Endpoints__HealthReady: /health/ready
      Orchestrator__Systems__5__Endpoints__Status: /api/monitor/service/status
      Orchestrator__Systems__5__Endpoints__Start: /api/monitor/service/start
      Orchestrator__Systems__5__Endpoints__Stop: /api/monitor/service/stop
      Orchestrator__Systems__5__Endpoints__Metrics: /api/monitor/snapshot
      Orchestrator__Systems__5__Ui__Icon: database
      Orchestrator__Systems__5__Ui__Color: "#dc2626"
      Orchestrator__Systems__5__Instances__Mode: active
    depends_on:
      - monitor-receptor-api
      - monitor-arquivador-api
      - monitor-sintetizador-api
      - monitor-analisador-api
      - monitor-integrador-api
      - monitor-carga-api
      - monitor-receptor-front
      - monitor-arquivador-front
      - monitor-sintetizador-front
      - monitor-analisador-front
      - monitor-integrador-front
      - monitor-carga-front
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 25s
    networks:
      - cte-chain

  orquestrador-front:
    build:
      context: ./0-Orquestrador
      dockerfile: Dockerfile.front
    image: dfend-cte-orquestrador-front:local
    container_name: dfend-cte-orquestrador-front
    ports:
      - "4220:80"
    depends_on:
