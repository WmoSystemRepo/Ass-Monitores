  monitor-carga-api:
    build:
      context: ./6-Carga
      dockerfile: Dockerfile
    image: dfend-cte-monitor-carga:local
    container_name: dfend-cte-monitor-carga
    ports:
      - "5080:5080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5080
      Monitor__ServiceId: dfend-cte-monitor-carga
      Monitor__DisplayName: Monitor Carga CT-e
      Monitor__Domain: carga
      Monitor__ApiVersion: "1.0"
      Monitor__MonitoredService: DFEND_CTe_Carga
      Monitor__PreferLocalProcess: "false"
      Monitor__InternalApiKey: ${CTE_INTERNAL_API_KEY:-dev-cte-chain-key}
      Monitor__ConnectionString: ${MONITOR_CARGA_CONNECTION_STRING:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5080/health/live"]
      interval: 15s
