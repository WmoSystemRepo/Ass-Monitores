    depends_on:
      - monitor-sintetizador-api
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 20s
      timeout: 5s
      retries: 3
    networks:
      - cte-chain

  monitor-analisador-api:
    build:
      context: ./4-Analisador
      dockerfile: Dockerfile
    image: dfend-cte-monitor-analisador:local
    container_name: dfend-cte-monitor-analisador
    ports:
      - "5040:5040"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5040
      Monitor__ServiceId: dfend-cte-monitor-analisador
      Monitor__DisplayName: Monitor Analisador CT-e
      Monitor__Domain: analisador
      Monitor__ApiVersion: "1.0"
      Monitor__MonitoredService: DFEND_CTe_Analisador
      Monitor__CodServicoAnalisador: "6"
      Monitor__PreferLocalProcess: "false"
      Monitor__InternalApiKey: ${CTE_INTERNAL_API_KEY:-dev-cte-chain-key}
      Monitor__ConnectionString: ${MONITOR_ANALISADOR_CONNECTION_STRING:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5040/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - cte-chain

  monitor-analisador-front:
    build:
      context: ./4-Analisador
      dockerfile: Dockerfile.front
    image: dfend-cte-monitor-analisador-front:local
    container_name: dfend-cte-monitor-analisador-front
    ports:
      - "4240:80"
    depends_on:
      - monitor-analisador-api
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 20s
      timeout: 5s
      retries: 3
    networks:
      - cte-chain

  monitor-integrador-api:
    build:
      context: ./5-Integrador
      dockerfile: Dockerfile
    image: dfend-cte-monitor-integrador:local
    container_name: dfend-cte-monitor-integrador
    ports:
      - "5050:5050"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5050
      Monitor__ServiceId: dfend-cte-monitor-integrador
      Monitor__DisplayName: Monitor Integrador CT-e
      Monitor__Domain: integrador
      Monitor__ApiVersion: "1.0"
      Monitor__MonitoredService: DFEND_CTe_Integrador
      Monitor__CodServicoIntegrador: "7"
      Monitor__PreferLocalProcess: "false"
      Monitor__InternalApiKey: ${CTE_INTERNAL_API_KEY:-dev-cte-chain-key}
      Monitor__ConnectionString: ${MONITOR_INTEGRADOR_CONNECTION_STRING:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5050/health/live"]
      interval: 15s
      timeout: 5s
