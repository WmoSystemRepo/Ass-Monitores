# Sobe BFF + Front do Monitor Integrador.
# Cadeia completa: use CT_e/docker-compose.chain.yml
services:
  monitor-integrador-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: dfend-cte-monitor-integrador:local
    container_name: dfend-cte-monitor-integrador
    ports:
      - "5050:5050"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5050
      Monitor__ServiceId: dfend-cte-monitor-integrador
      Monitor__DisplayName: Monitor Integrador CT-e
      Monitor__Domain: integrador
      Monitor__ApiVersion: "1.0"
      Monitor__MonitoredService: DFEND_CTe_Integrador
      Monitor__CodServicoIntegrador: "7"
      Monitor__PreferLocalProcess: "false"
      Monitor__InternalApiKey: ${CTE_INTERNAL_API_KEY:-dev-cte-chain-key}
      Monitor__ConnectionString: ${MONITOR_INTEGRADOR_CONNECTION_STRING:-Data Source=host.docker.internal;Initial Catalog=bd_cte_sintetico;Integrated Security=true;TrustServerCertificate=True;Connect Timeout=60}
      Monitor__ConnectionStringSintetico: ${MONITOR_INTEGRADOR_CONNECTION_STRING_SINTETICO:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5050/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  monitor-integrador-front:
    build:
      context: .
      dockerfile: Dockerfile.front
    image: dfend-cte-monitor-integrador-front:local
    container_name: dfend-cte-monitor-integrador-front
    ports:
      - "4250:80"
    depends_on:
      - monitor-integrador-api
