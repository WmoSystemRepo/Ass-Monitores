# Gateway CT-e — ponto de entrada único (porta 8080)
server {
    listen 80;
    server_name _;

    location = /health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    location /api/orquestrador/ {
        proxy_pass http://orquestrador-api:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/receptor/ {
        proxy_pass http://monitor-receptor-api:5010/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/arquivador/ {
        proxy_pass http://monitor-arquivador-api:5020/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /hubs/receptor/ {
        proxy_pass http://monitor-receptor-api:5010/hubs/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location /hubs/arquivador/ {
        proxy_pass http://monitor-arquivador-api:5020/hubs/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location /receptor/ {
        proxy_pass http://monitor-receptor-front:80/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /arquivador/ {
        proxy_pass http://monitor-arquivador-front:80/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://orquestrador-front:80/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
