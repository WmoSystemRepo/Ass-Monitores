# Cadeia CT-e — Orquestrador + monitores (API + Front) + gateway
#
# Uso (a partir da pasta CT_e):
#   $env:CTE_INTERNAL_API_KEY = "dev-cte-chain-key"
#   docker compose -f docker-compose.chain.yml up --build
#
# Bootstrap = Compose (API + Front). Ligar = só contrato HTTP (service/start).
# Worker fiscal permanece no host Windows (PreferLocalProcess=false).
# SQL DEV: host.docker.internal (ajuste a connection string ao seu servidor).

name: cte-chain

services:
  monitor-receptor-api:
    build:
      context: ./1-Receptor
      dockerfile: Dockerfile
    image: dfend-cte-monitor-receptor:local
    container_name: dfend-cte-monitor-receptor
    ports:
      - "5010:5010"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5010
      Monitor__ServiceId: dfend-cte-monitor-receptor
      Monitor__DisplayName: Monitor Receptor CT-e
      Monitor__Domain: receptor
      Monitor__ApiVersion: "1.0"
      Monitor__MonitoredService: DFEND_CTe_Receptor
      Monitor__PreferLocalProcess: "false"
      Monitor__InternalApiKey: ${CTE_INTERNAL_API_KEY:-dev-cte-chain-key}
      # Linux container: use SQL auth (Integrated Security não funciona). Ex.:
      # $env:MONITOR_RECEPTOR_CONNECTION_STRING = "Server=host.docker.internal;Database=bd_cte_recepcao;User Id=...;Password=...;TrustServerCertificate=True"
      Monitor__ConnectionString: ${MONITOR_RECEPTOR_CONNECTION_STRING:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5010/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - cte-chain

  monitor-receptor-front:
    build:
      context: ./1-Receptor
      dockerfile: Dockerfile.front
    image: dfend-cte-monitor-receptor-front:local
    container_name: dfend-cte-monitor-receptor-front
    ports:
      - "4200:80"
    depends_on:
      - monitor-receptor-api
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 20s
      timeout: 5s
      retries: 3
    networks:
      - cte-chain

  monitor-arquivador-api:
    build:
      context: ./2-Arquivador
      dockerfile: Dockerfile
    image: dfend-cte-monitor-arquivador:local
    container_name: dfend-cte-monitor-arquivador
    ports:
      - "5020:5020"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5020
      Monitor__ServiceId: dfend-cte-monitor-arquivador
      Monitor__DisplayName: Monitor Arquivador CT-e
      Monitor__Domain: arquivador
      Monitor__ApiVersion: "1.0"
      Monitor__MonitoredService: DFEND_CTe_Arquivador
      Monitor__PreferLocalProcess: "false"
      Monitor__InternalApiKey: ${CTE_INTERNAL_API_KEY:-dev-cte-chain-key}
      Monitor__ConnectionString: ${MONITOR_ARQUIVADOR_CONNECTION_STRING:-}
      Monitor__ConnectionStringSintetico: ${MONITOR_ARQUIVADOR_CONNECTION_STRING_SINTETICO:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5020/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - cte-chain

  monitor-arquivador-front:
    build:
      context: ./2-Arquivador
      dockerfile: Dockerfile.front
    image: dfend-cte-monitor-arquivador-front:local
    container_name: dfend-cte-monitor-arquivador-front
    ports:
      - "4210:80"
    depends_on:
      - monitor-arquivador-api
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 20s
      timeout: 5s
      retries: 3
    networks:
      - cte-chain

  monitor-sintetizador-api:
    build:
      context: ./3-Sintetizador
      dockerfile: Dockerfile
    image: dfend-cte-monitor-sintetizador:local
    container_name: dfend-cte-monitor-sintetizador
    ports:
      - "5030:5030"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5030
      Monitor__ServiceId: dfend-cte-monitor-sintetizador
      Monitor__DisplayName: Monitor Sintetizador CT-e
      Monitor__Domain: sintetizador
      Monitor__ApiVersion: "1.0"
      Monitor__MonitoredService: DFEND_CTe_Sintetizador
      Monitor__CodServicoSintetizador: "8"
      Monitor__PreferLocalProcess: "false"
      Monitor__InternalApiKey: ${CTE_INTERNAL_API_KEY:-dev-cte-chain-key}
      Monitor__ConnectionString: ${MONITOR_SINTETIZADOR_CONNECTION_STRING:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5030/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - cte-chain

  monitor-sintetizador-front:
    build:
      context: ./3-Sintetizador
      dockerfile: Dockerfile.front
    image: dfend-cte-monitor-sintetizador-front:local
