  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    image: dfend-cte-gateway:local
    container_name: dfend-cte-gateway
    ports:
      - "8080:80"
    depends_on:
      - orquestrador-api
      - orquestrador-front
